name: Sync FAC Bulk Mirror

# Sprint 4, FAC_API_Improvement_Sprint_Checklist.md — refreshes the
# local mirror of FAC's bulk CSV export (scripts/sync-fac-mirror.mjs).
# No FAC_API_KEY needed here: the bulk download is a plain file fetch,
# doesn't touch FAC's ~1,000/hour rate-limited API quota at all.
#
# Schedule: FAC's own refresh cadence isn't documented and was
# confirmed live during Sprint 4's build to be NOT daily (contrary to
# the original checklist's guess) — the observed refresh was ~5 days
# before the check.
#
# Weekly (was Mon/Thu). Each sync writes ~1.48M rows (413K general +
# 674K findings + 150K findings_text + 144K corrective_action_plans +
# ~72K additional_eins + ~27K additional_ueis — the last two added in
# Sprint 5); twice a week is ~12.7M rows/month, over Turso's free-tier
# 10M writes/month cap (plan confirmed free tier 2026-08). Weekly is
# ~6.4M/month — comfortably under — and still comfortably inside the
# observed ~5-day FAC refresh cadence. Orgs within ±60 days of their
# filing deadline already bypass the mirror for a live check
# (lib/org-cache-ttl.ts), so a few extra days of mirror staleness for
# everyone else costs nothing that matters. Revisit if the plan changes
# or more cadence data points land.
on:
  schedule:
    - cron: '17 9 * * 1' # 09:17 UTC Monday
  workflow_dispatch: {} # manual trigger, e.g. for a first-run or a retry

permissions:
  # write (was read) so the post-sync step can commit the refreshed
  # lib/site-stats.json (homepage stat bar) back to main. If main is
  # ever branch-protected against direct pushes, that step is
  # continue-on-error — the mirror sync itself still succeeds and the
  # stats just go stale until refreshed by hand.
  contents: write

concurrency:
  group: sync-fac-mirror
  cancel-in-progress: false # never cancel a run mid-swap

jobs:
  sync:
    name: Sync mirror tables
    runs-on: ubuntu-latest
    timeout-minutes: 90 # measured ~17.5 min for a real full run; generous margin for FAC being slow, not a sign this normally takes that long

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run sync
        run: node scripts/sync-fac-mirror.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Optional — the script no-ops the failure-notification email
          # (with a log line, not an error) if these aren't set.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          WAITLIST_NOTIFY_EMAIL: ${{ secrets.WAITLIST_NOTIFY_EMAIL }}

      # scripts/sync-fac-mirror.mjs rewrites lib/site-stats.json (homepage
      # stat bar) at the end of a successful run. Commit it back if it
      # moved. [skip ci] + the fact that GITHUB_TOKEN pushes don't
      # retrigger workflows keeps this from looping. continue-on-error so
      # a protected main (or any push hiccup) never marks the sync failed.
      - name: Commit refreshed homepage stats
        if: success()
        continue-on-error: true
        run: |
          if git diff --quiet -- lib/site-stats.json; then
            echo "lib/site-stats.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/site-stats.json
          git commit -m "chore: refresh homepage stat bar from weekly FAC mirror sync [skip ci]"
          git push
