name: Test & Deploy to Vercel

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm run test
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build Next.js
        run: npm run build
        env:
          FAC_API_KEY: ${{ secrets.FAC_API_KEY }}
          NEXT_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_URL }}
          # The mirror-backed pages that prerender at build time
          # (/single-audit, /single-audit/state/*) read the live Turso
          # DB during `next build` — without these the client falls back
          # to a throwaway local SQLite file (lib/db/index.ts) and those
          # pages prerender empty. Same DB the deploy step's `vercel
          # build` needs (below) and the weekly sync writes to.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # BetaHuhn/deploy-to-vercel-action assumes the `vercel` binary is
      # already on PATH and never installs it, which fails as
      # `spawn vercel ENOENT` on current runners. Vercel's own documented
      # GitHub Actions flow (below) installs the CLI itself instead of
      # relying on an unmaintained third-party action.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # `vercel pull` writes prod env to .vercel/.env.production.local,
          # but `vercel build` on a non-Vercel runner doesn't reliably
          # apply it to the `next build` subprocess — the prerendered
          # mirror-backed pages (/single-audit, /single-audit/state/*)
          # came out empty because the DB client fell back to a local
          # SQLite file. Pass the DB creds through explicitly.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  notify:
    name: Notify on Deployment
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always()

    steps:
      - name: Check deployment status
        # `deploy` only runs on a push to main; on every PR its `if`
        # skips it, so `needs.deploy.result` is "skipped". The old check
        # compared that literal against "success" and exited 1 — a
        # permanent red "Notify on Deployment" X on every PR. "skipped"
        # here means "no deploy was expected", which is fine; only a
        # genuine "failure"/"cancelled" is worth failing on.
        run: |
          result="${{ needs.deploy.result }}"
          case "$result" in
            success)  echo "✅ Deployment to Vercel succeeded" ;;
            skipped)  echo "ℹ️ No deploy for this event (PR / non-main) — nothing to check" ;;
            *)        echo "❌ Deploy job result: $result"; exit 1 ;;
          esac
