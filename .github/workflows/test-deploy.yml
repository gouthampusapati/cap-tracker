name: Test & Deploy

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm run test
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build
        run: npm run build
