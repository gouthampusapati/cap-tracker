name: Test & Deploy to Vercel

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# BetaHuhn/deploy-to-vercel-action uses GITHUB_TOKEN to record a GitHub
# Deployment + deployment status (and, on a PR, to add the PR_LABELS
# label). The default token this repo issues is read-only, which fails
# with "Resource not accessible by integration" — grant just what the
# action needs.
permissions:
  contents: read
  deployments: write
  statuses: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm run test
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build Next.js
        run: npm run build
        env:
          FAC_API_KEY: ${{ secrets.FAC_API_KEY }}
          NEXT_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_URL }}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION: true
          PR_LABELS: deployed

  notify:
    name: Notify on Deployment
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always()

    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deployment to Vercel succeeded"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
